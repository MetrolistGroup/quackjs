// Run with --no-configuration-cache. Resolve real production graphs, not substituted project dependencies.
gradle.afterProject { project ->
    project.tasks.register('verifyCipherRuntime') {
        group = 'verification'
        doLast {
            def names = ['jvmRuntimeClasspath', 'desktopRuntimeClasspath', 'androidMainRuntimeClasspath',
                         'androidRuntimeClasspath', 'debugRuntimeClasspath']
            def selected = project.configurations.findAll { it.canBeResolved && it.name in names }
            assert !selected.empty : "No production runtime configurations in ${project.path}"
            selected.each { configuration ->
                def graph = configuration.incoming.resolutionResult
                def unresolved = graph.allDependencies.findAll { it instanceof org.gradle.api.artifacts.result.UnresolvedDependencyResult }
                assert unresolved.empty : unresolved*.attempted
                def components = graph.allComponents
                def ids = components*.id*.displayName
                assert !ids.any { it.toLowerCase().contains('quickjs') || it.contains('io.github.dokar3') } : ids
                assert components.any { it.moduleVersion?.name?.startsWith('quackjs') }
                println("VERIFIED ${project.path}:${configuration.name}")
                components.findAll { it.moduleVersion?.name?.startsWith('quackjs') || it.moduleVersion?.name?.startsWith('innertubex') }.each {
                    println("  ${it.id.displayName}")
                }
            }
        }
    }
}
