// Run with --no-configuration-cache. Resolve real production graphs, not substituted project dependencies.
gradle.afterProject { project ->
    project.tasks.register('verifyCipherRuntime') {
        group = 'verification'
        doLast {
            def names = ['jvmRuntimeClasspath', 'desktopRuntimeClasspath', 'androidMainRuntimeClasspath',
                         'androidRuntimeClasspath', 'debugRuntimeClasspath']
            def selected = project.configurations.findAll { it.canBeResolved && it.name in names }
            assert !selected.empty : "No production runtime configurations in ${project.path}"
            selected.each { configuration ->
                def components = configuration.incoming.resolutionResult.allComponents*.id*.displayName
                assert !components.any { it.toLowerCase().contains('quickjs') || it.contains('io.github.dokar3') } : components
                def artifacts = configuration.resolvedConfiguration.resolvedArtifacts
                assert artifacts.any { it.moduleVersion.id.group == 'meow.nyx' && it.name.startsWith('quackjs') } || project.name == 'quackjs'
                println("VERIFIED ${project.path}:${configuration.name}")
                artifacts.findAll { it.moduleVersion.id.group in ['meow.nyx', 'com.github.MetrolistGroup.innertubex'] }.each {
                    println("  ${it.moduleVersion.id} -> ${it.file.name}")
                }
            }
        }
    }
}
